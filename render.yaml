databases:
  - name: qr-scans-db
    plan: free
    databaseName: qr_scans
    user: qr_scans_user

services:
  - type: web
    name: qr-scans-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn event_management.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qr-scans-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: "3.12.7"
